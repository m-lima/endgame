[workspace]
members = ["cli", "endgame", "nginx"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
atomic_refcell = "0.1.13"
base64 = "0.22.1"
crypter = "0.3.1"
libc = "0.2.180"
percent-encoding = "2.3.2"
rand = "0.9.2"
reqwest = { version = "0.13.1", default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = "1.49.0"
url = { version = "2.5.8", default-features = false }

[workspace.metadata.crane]
name = "endgame"
